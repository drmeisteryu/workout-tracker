<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>리프트로그</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="리프트로그">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --line:#2c313c;
  --txt:#e8eaf0; --sub:#9aa3b2; --mut:#6b7280;
  --push:#ff8a5b; --push-d:#3a241c; --pull:#4ea1ff; --pull-d:#16263d;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:78px;padding-top:env(safe-area-inset-top)}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit}
.hidden{display:none!important}

/* Header */
header{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 0 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htitle{font-size:16px;font-weight:700}
.hsub{font-size:11.5px;color:var(--sub)}
.iconbtn{background:var(--card2);color:var(--sub);border-radius:10px;width:38px;height:34px;font-size:16px;display:flex;align-items:center;justify-content:center}

/* Session selector */
.sess{display:flex;align-items:center;gap:8px;margin-top:8px}
.sess .nav{background:var(--card2);color:var(--txt);width:40px;height:46px;border-radius:12px;font-size:20px;flex:0 0 auto}
.sess .nav:active{background:var(--line)}
.sesspill{flex:1;border-radius:12px;padding:7px 12px;text-align:center;border:1px solid var(--line);background:var(--card)}
.sesspill .l1{font-weight:700;font-size:15px}
.sesspill .l2{font-size:11.5px;color:var(--sub);margin-top:1px}
.push .sesspill,.push.sesspill{border-color:var(--push);background:linear-gradient(180deg,var(--push-d),var(--card))}
.pull .sesspill,.pull.sesspill{border-color:var(--pull);background:linear-gradient(180deg,var(--pull-d),var(--card))}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;vertical-align:middle}
.tag.p{background:var(--push);color:#1a0f08}
.tag.u{background:var(--pull);color:#06182b}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}
.card h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px;letter-spacing:.2px}
.sectlabel{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:18px 2px 6px}
.twogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.twogrid .ex{margin:0}
.twogrid .exhead{padding:9px 11px}
.twogrid .exname{font-size:13px}
.twogrid .exmeta{font-size:10px}
.twogrid .sets{padding:0 6px 6px}
.twogrid .setrow{padding:3px}

/* Condition card */
.bwrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bwrow label{font-size:13px;color:var(--sub);flex:0 0 64px}
.bw-input{flex:1;display:flex;align-items:center;gap:8px}
.bw-input input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 12px;font-size:18px;font-weight:700;text-align:center}
.bw-input .unit{color:var(--mut);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.metric{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.metric label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
.metric select{width:100%;background:transparent;border:none;color:var(--txt);font-size:15px;font-weight:600;text-align:center}
.collapse-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.chev{color:var(--mut);font-size:13px;transition:transform .2s}
.chev.open{transform:rotate(90deg)}

/* Exercise */
.ex{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.ex.work{border-left:3px solid var(--accent)}
.ex.warmup{border-left:3px solid var(--warn)}
.ex.cooldown{border-left:3px solid var(--ok)}
.ex.cardio{border-left:3px solid var(--pull);border-style:dashed solid dashed solid}
.cardiorow{display:grid;grid-template-columns:1fr 90px 64px;gap:8px;align-items:center;padding:4px 13px 12px}
.cardiorow input{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 4px;font-size:16px;font-weight:600;text-align:center;width:100%}

/* nutrition */
.nsum{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.nsum .big{font-size:20px;font-weight:800}
.daytoggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);border-radius:12px;padding:4px}
.daytoggle button{background:transparent;color:var(--sub);border-radius:9px;padding:10px;font-size:14px;font-weight:700}
.daytoggle button.on{background:var(--accent);color:#160d2e}
.nitem{display:grid;grid-template-columns:52px 1fr 46px;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.nitem:first-child{border-top:none}
.nitem .t{font-size:13px;font-weight:700;color:var(--sub);text-align:center}
.nitem .nm{font-weight:700;font-size:14.5px}
.nitem .amt{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.nitem.sup .nm::after{content:'보충제';white-space:nowrap;display:inline-block;font-size:9.5px;font-weight:800;background:var(--pull);color:#06182b;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.nitem.done .nm{color:var(--ok)}
.nitem.next{background:rgba(167,139,250,.08);border-radius:10px}
.advice{font-size:13px;line-height:1.55;border-radius:10px;padding:10px 12px;background:var(--card2)}
.advice b{color:var(--txt)}
.tinput{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tinput label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.tinput input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px;font-size:15px;font-weight:600;text-align:center}
.exhead{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;gap:8px}
.exname{font-weight:700;font-size:15px}
.exmeta{font-size:11px;color:var(--mut);margin-top:2px}
.exprog{font-size:11px;color:var(--sub);background:var(--card2);border-radius:20px;padding:3px 9px;flex:0 0 auto}
.swapbtn{font-size:11px;color:var(--sub);background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 10px;flex:0 0 auto}
.swapbtn.on{color:var(--accent);border-color:var(--accent)}
.swaptag{font-size:10px;background:var(--accent);color:#160d2e;border-radius:5px;padding:1px 6px;font-weight:700;vertical-align:middle}
.rec{font-size:11.5px;color:var(--sub);padding:0 13px 9px;line-height:1.5;cursor:pointer}
.rec:active{color:var(--accent)}
.sets{padding:0 8px 8px}
.sethdr,.setrow{display:grid;grid-template-columns:22px 1fr 1fr 52px 46px;gap:6px;align-items:center}
.sethdr{font-size:10px;color:var(--mut);padding:2px 4px 6px;text-transform:uppercase;letter-spacing:.5px}
.sethdr .c{text-align:center}
.setrow{padding:5px 4px;border-top:1px solid var(--line)}
.setrow.done{background:rgba(52,211,153,.06)}
.setno{font-size:13px;color:var(--sub);text-align:center;font-weight:600}
.cell{display:flex;flex-direction:column;align-items:stretch}
.cell input{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
  padding:9px 4px;font-size:16px;font-weight:600;text-align:center;width:100%}
.cell input:focus{outline:none;border-color:var(--accent)}
.cell .tgt{font-size:9.5px;color:var(--mut);text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpe-sel{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 2px;font-size:15px;font-weight:600;text-align:center;width:100%}
.donebtn{background:var(--card2);border:2px solid var(--mut);color:transparent;border-radius:9px;height:44px;width:100%;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}
.donebtn::before{content:'';width:13px;height:13px;border:2px solid var(--mut);border-radius:4px;display:block}
.donebtn.on{background:var(--ok);color:#04231a;border-color:var(--ok)}
.donebtn.on::before{display:none}
.donebtn.on::after{content:'✓';font-size:22px}
.setctl{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 4px 2px;border-top:1px solid var(--line)}
.setctl button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700}
.setctl button:disabled{opacity:.35}
.setctl .cnt{font-size:12px;color:var(--sub);min-width:84px;text-align:center}
.setctl .cnt b{color:var(--txt)}
.setctl .cnt.chg b{color:var(--accent)}
.suggest{font-size:11px;color:var(--accent);padding:3px 4px 7px;display:flex;gap:5px;align-items:flex-start}
.suggest .pchip{color:var(--mut);background:var(--card2);border-radius:5px;padding:1px 5px;font-size:10px}
.warm .sets .cell input{font-size:14px}

/* finish bar */
.finishbar{margin:16px 0 8px}
.bigbtn{width:100%;background:var(--accent);color:#160d2e;font-weight:800;font-size:16px;border-radius:14px;padding:15px}
.bigbtn.ghost{background:var(--card2);color:var(--sub);font-weight:600}
.bigbtn.done{background:var(--ok);color:#04231a}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(20,23,29,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px}
nav button .ic{font-size:20px}
nav button.active{color:var(--accent)}

/* history */
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:9px 0}
.hcard .top{display:flex;justify-content:space-between;align-items:center}
.hcard .d{font-size:12px;color:var(--sub)}
.hcard .sets-sm{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.7}
.hcard .sets-sm b{color:var(--txt)}
.pill{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .k{font-size:10.5px;color:var(--sub);margin-top:3px}
.stat .u{font-size:11px;color:var(--mut)}
svg.chart{width:100%;height:130px;display:block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button{background:var(--card2);color:var(--txt);width:36px;height:32px;border-radius:9px;font-size:18px}
.cal-head h3{font-size:15px;color:var(--txt)!important}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--mut);padding:2px 0}
.cal-dow.sun{color:#f87171}.cal-dow.sat{color:#60a5fa}
.cal-cell{min-width:0;height:44px;border-radius:9px;background:var(--card2);position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.cal-cell.empty{background:transparent}
.cal-cell.train{background:linear-gradient(160deg,rgba(167,139,250,.35),rgba(167,139,250,.12));color:var(--txt);font-weight:700;border:1px solid var(--accent)}
.cal-cell.today{outline:2px solid var(--warn);outline-offset:-2px}
.cal-cell .cal-d{position:relative;z-index:1}
.cal-cell .cal-dot{position:absolute;bottom:1px;font-size:8px;line-height:1}
.cal-cell .cal-bw{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--sub)}
.legend{font-size:11px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* toast & modal */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#160d2e;
  font-weight:700;font-size:13px;padding:10px 18px;border-radius:30px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h3{font-size:16px;color:var(--txt);margin-bottom:12px}
.sheet .row{display:flex;gap:10px;margin:9px 0}
.sheet button{flex:1;background:var(--card2);color:var(--txt);border-radius:11px;padding:13px;font-size:14px;font-weight:600;border:1px solid var(--line)}
.sheet button.danger{color:var(--bad)}
.sheet .close{background:var(--accent);color:#160d2e}
.muted{color:var(--mut);font-size:12px;text-align:center;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}

/* ===== 자유 운동 모드 ===== */
.frbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.frpill{flex:1;min-width:0;border-radius:12px;padding:7px 12px;border:1px solid var(--line);background:var(--card)}
.frpill.live{border-color:var(--ok);background:linear-gradient(180deg,rgba(52,211,153,.16),var(--card))}
.frpill.edit{border-color:var(--warn);background:linear-gradient(180deg,rgba(251,191,36,.14),var(--card))}
.frpill .l1{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.frpill .l2{font-size:11.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frpill .rest{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.frbtn{flex:0 0 auto;height:48px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:800;background:var(--ok);color:#04231a}
.frbtn.stop{background:var(--bad);color:#2a0606}
.frbtn.save{background:var(--warn);color:#2a1d02}
.addbtn{width:100%;background:var(--card2);color:var(--txt);border:1.5px dashed var(--accent);border-radius:14px;padding:16px;font-size:16px;font-weight:800;margin:12px 0}
.addbtn:active{background:var(--line)}
.startbig{width:100%;background:var(--ok);color:#04231a;font-weight:900;font-size:19px;border-radius:16px;padding:20px;margin:14px 0 4px}
.gtag{font-size:10px;font-weight:700;color:var(--sub);background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.xbtn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:15px;border:1px solid var(--line)}
.setrow.cardio,.sethdr.cardio{grid-template-columns:22px 1fr 46px}
.addset{flex:1;background:var(--accent)!important;color:#160d2e!important;border:none!important}
.timecard{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.timecard span{white-space:nowrap}
.timecard input{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 8px;font-size:15px;font-weight:700}
.donelist .hcard{cursor:pointer}
/* 운동 선택 시트 */
.sheet.tall{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pkq{width:100%;background:var(--card2);border:1px solid var(--accent);color:var(--txt);border-radius:11px;padding:13px;font-size:16px;margin-bottom:10px}
.pkq:focus{outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.sheet .chip{flex:0 0 auto;white-space:nowrap;background:var(--card2);color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:700}
.sheet .chip.on{background:var(--accent);color:#160d2e;border-color:var(--accent)}
.pkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pkitem{text-align:left;padding:11px 12px!important;display:flex;flex-direction:column;gap:2px;min-width:0}
.pkitem .k{font-size:14.5px;font-weight:800;color:var(--txt)}
.pkitem .e{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkitem .lp{font-size:10.5px;color:var(--accent)}
.pkitem.in{border-color:var(--ok)!important;opacity:.7}
.pknew{width:100%;background:var(--accent)!important;color:#160d2e!important;font-weight:800!important;margin-bottom:10px}
.sheet label.f{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
.sheet input.f{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:16px}

/* auth */
#authOverlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.authbox{width:100%;max-width:360px;text-align:center}
.authlogo{font-size:52px;margin-bottom:6px}
.authbox h2{font-size:20px;margin-bottom:4px}
.authsub{color:var(--sub);font-size:13px;margin:0 0 22px}
.authbox input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px;font-size:16px;margin-bottom:10px}
.authbox input:focus{outline:none;border-color:var(--accent)}
.authbtn{width:100%;background:var(--accent);color:#160d2e;font-weight:800;font-size:16px;border-radius:12px;padding:15px;margin-top:4px}
.authbtn:disabled{opacity:.6}
.autherr{color:var(--bad);font-size:13px;min-height:18px;margin:2px 0 6px}
.authtoggle{margin-top:16px;font-size:13px;color:var(--sub)}
.authtoggle a{color:var(--accent);font-weight:700;cursor:pointer;margin-left:5px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div>
        <div class="htitle">🏋️ 리프트로그</div>
        <div class="hsub" id="hsub">벌크업 · 상/하체 2분할 16주 · 주 4회</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span id="syncDot" title="로컬" style="font-size:10px;color:var(--mut)">●</span>
        <button class="iconbtn" onclick="openMenu()">⚙️</button>
      </div>
    </div>
    <div class="sess" id="sessSel"></div>
  </div>
</header>

<main class="wrap">
  <div id="view-today"></div>
  <div id="view-history" class="hidden"></div>
  <div id="view-nutri" class="hidden"></div>
  <div id="view-stats" class="hidden"></div>
</main>

<nav>
  <button data-tab="today" class="active" onclick="switchTab('today')"><span class="ic">🏋️</span>오늘</button>
  <button data-tab="nutri" onclick="switchTab('nutri')"><span class="ic">🥤</span>영양</button>
  <button data-tab="history" onclick="switchTab('history')"><span class="ic">📖</span>기록</button>
  <button data-tab="stats" onclick="switchTab('stats')"><span class="ic">📈</span>통계</button>
</nav>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<!-- 로그인 오버레이 -->
<div id="authOverlay" class="hidden">
  <div class="authbox">

  ['코어',[['Cable Crunch','케이블 크런치'],['Machine Abs','복근 머신'],['Hanging Leg Raise','행잉 레그레이즈'],['Crunch','크런치'],['Ab Rollout','앱 롤아웃']]],

];
const GROUP_LABEL={'하체전면':'하체 앞','하체후면':'하체 뒤'};
function groupLabel(g){ return GROUP_LABEL[g]||g||'기타'; }
const CAT_GROUP={}, KO={};
FREE_CATALOG.forEach(([g,list])=>list.forEach(([en,ko])=>{ CAT_GROUP[en]=g; KO[en]=ko; }));
// 같은 운동의 다른 표기 → 기록명 하나로 (지난 기록·1RM 계산이 끊기지 않도록)
const ALIAS={'Barbell Squat':'Barbell Back Squat','Flat Barbell Bench Press':'Flat Bench Press','OHP':'Overhead Press',
  'Assisted-Pull Up':'Assisted Pull-Up','Incline Barbell Press':'Incline Bench Press'};
function canon(name){ return ALIAS[name]||name; }
function koOf(name){ return KO[canon(name)]||''; }
function exLabel(name){ return name; } // 운동 이름은 영문으로 표시
function isCardio(name){ return groupOf(name)==='유산소'; }
function customEx(){ try{ return (state&&state.customEx)||{}; }catch(e){ return {}; } } // 내가 직접 추가한 운동 {이름: 부위}

function groupOf(name){
  if(EX_GROUP[name]) return EX_GROUP[name];
  if(CAT_GROUP[canon(name)]) return CAT_GROUP[canon(name)];
  const cu=customEx();
  if(Object.prototype.hasOwnProperty.call(cu,name)) return cu[name]||null;
  for(const[g,list] of Object.entries(MUSCLE_GROUPS)){ if(list.some(x=>norm(x)===norm(name))) return g; }
  return null;
}
function norm(s){ return String(s).toLowerCase().replace(/dumbell/g,'dumbbell').replace(/[^a-z0-9]/g,''); }
function altsFor(name){ const g=groupOf(name); if(!g) return [];
  return (MUSCLE_GROUPS[g]||[]).filter(x=>norm(x)!==norm(name)); }

/* 장비별 중량 조정 단위: 바벨 5kg · 덤벨 1kg · 그 외(케이블/머신) 2.5kg */
function equipOf(name){
  const n=norm(name);
  if(n.includes('dumbbell')||n.includes('bulgariansplit')||n.includes('goblet')) return 'dumbbell';
  if(n.includes('barbell')||n.includes('deadlift')||n.includes('benchpress')||n.includes('backsquat')||n.includes('overheadpress')||n.includes('ohp')||n.includes('emptybar')||n.includes('barbellsquat')) return 'barbell';
  return 'cable';
}
function stepForEquip(name){ const e=equipOf(name); return e==='barbell'?5:e==='dumbbell'?1:2.5; }
function roundStep(load,step){ return Math.round(load/step)*step; }

/* ===== Flatten sessions (활성 프로그램 기준) ===== */
let SESSIONS = [];
function activeProgram(){ return (state && state.program) ? state.program : PROGRAM; }
function rebuildSessions(prog){
  SESSIONS=[];
  (prog||activeProgram()).weeks.forEach(w=>{
    w.days.forEach(d=>{
      const id = d.label.split(' ')[0]; // e.g. UA1, W1D1
      const k = sessKind(d.label);
      SESSIONS.push({id, label:d.label, weekId:w.id, weekTitle:w.title,
        type:k.type, tag:k.tag, est:d.est, exercises:d.exercises});
    });
  });
}
// 세션 색·태그: 상체=주황, 하체=파랑 (이전 Push/Pull 라벨도 지원)
function sessKind(label){
  if(/하체|Lower/i.test(label)) return {type:'pull',tag:'LOWER'};
  if(/상체|Upper/i.test(label)) return {type:'push',tag:'UPPER'};
  return /Push/i.test(label)?{type:'push',tag:'PUSH'}:{type:'pull',tag:'PULL'};
}
rebuildSessions(PROGRAM);

/* ===== Supabase 설정 (배포 시 주입) ===== */
const SUPABASE_URL='__SUPABASE_URL__';
const SUPABASE_ANON='__SUPABASE_ANON__';
const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON && !SUPABASE_URL.startsWith('__') && window.supabase);
let sb = CLOUD ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
let authUser = null;          // {email, key} — Supabase Auth 미사용
const LS_USER='ybk_user_email';
const EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
// 이메일 → 고정 키(sha256). 테이블에 이메일 원문을 남기지 않기 위함.
async function keyFor(email){
  const buf=new TextEncoder().encode(String(email).trim().toLowerCase());
  const h=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ===== Storage (로컬 캐시 + 클라우드 동기화) ===== */
const LS='ybk_workout_v1';
function loadState(){
  let s=null; try{s=JSON.parse(localStorage.getItem(LS));}catch(e){}
  if(!s){ s=seedState(); }
  return s;
}
let cloudTimer=null, syncEl=null, saveSeq=0;
// 헬스장처럼 신호가 약한 곳에서 업로드가 실패한 기록을 보호한다.
//  · LS_DIRTY : 아직 클라우드에 못 올린 변경이 있음
//  · LS_SYNCED: 이 기기의 데이터가 클라우드와 한 번 이상 맞춰졌음
//  · cloudReady: 이번 실행에서 클라우드를 먼저 읽기 전에는 업로드하지 않는다
//    (새 기기 첫 로그인 때 빈 초기 데이터가 클라우드 기록을 덮어쓰지 않도록)
const LS_DIRTY='ybk_dirty', LS_SYNCED='ybk_synced';
let cloudReady=false;
function saveState(s){
  s.savedAt=Date.now(); saveSeq++;
  localStorage.setItem(LS, JSON.stringify(s));
  if(CLOUD && authUser){ localStorage.setItem(LS_DIRTY,'1'); scheduleCloudSave(); }
}
function scheduleCloudSave(){ clearTimeout(cloudTimer); setSync('saving'); cloudTimer=setTimeout(pushCloud, 1200); }
async function pushCloud(){
  if(!CLOUD||!authUser||!cloudReady) return; // 클라우드를 읽은 뒤에만 올린다 (변경은 로컬·dirty로 보존)
  clearTimeout(cloudTimer); cloudTimer=null;
  const seq=saveSeq;
  try{
    const {error}= await sb.from('app_data').upsert(
      {user_key:authUser.key, data:state, updated_at:new Date().toISOString()},{onConflict:'user_key'});
    if(error) throw error;
    if(seq===saveSeq) localStorage.removeItem(LS_DIRTY);
    localStorage.setItem(LS_SYNCED,'1');
    setSync('saved');
  }catch(e){
    setSync('error');
    if(!cloudTimer) cloudTimer=setTimeout(pushCloud, 20000); // 20초 뒤 재시도
  }
}
// 앱을 닫거나 다른 앱으로 갈 때 대기 중인 저장을 바로 올리고, 네트워크가 돌아오면 재시도
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && cloudTimer) pushCloud(); });
window.addEventListener('online',()=>{
  if(!CLOUD||!authUser) return;
  if(!cloudReady) syncFromCloud(); else if(localStorage.getItem(LS_DIRTY)==='1') pushCloud(); });
// 네트워크가 느리거나 막혀도 앱이 멈추지 않도록 타임아웃을 둔다
function withTimeout(promise, ms){
  return Promise.race([promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}
async function pullCloud(){
  if(!CLOUD||!authUser) return;
  try{
    const {data,error}= await withTimeout(
      sb.from('app_data').select('data').eq('user_key',authUser.key).maybeSingle(), 8000);
    if(error) throw error;
    const cloud = data && data.data;
    const dirty = localStorage.getItem(LS_DIRTY)==='1';
    const localWins = !cloud || (dirty && localStorage.getItem(LS_SYNCED)==='1' && (state.savedAt||0) >= (cloud.savedAt||0));
    cloudReady=true;
    if(localWins){ await pushCloud(); return; } // 최초 업로드, 또는 못 올린 로컬 기록이 더 최신 → 로컬을 올림
    // 클라우드를 쓰되, 못 올린 변경이 있었다면 이 기기에만 있는 자유 운동 기록·진행 중 운동은 살린다
    const merged = dirty ? mergeUnsynced(cloud, state) : 0;
    state=cloud; if(!state.overrides)state.overrides={};
    localStorage.setItem(LS,JSON.stringify(state)); localStorage.removeItem(LS_DIRTY); localStorage.setItem(LS_SYNCED,'1');
    if(merged) saveState(state); else setSync('saved');
  }catch(e){
    setSync('error');
    setTimeout(()=>{ if(!cloudReady) syncFromCloud(); }, 30000); // 30초 뒤 다시 시도
  }
}
function mergeUnsynced(cloud, local){
  let n=0; cloud.logs=cloud.logs||{};
  Object.entries(local.logs||{}).forEach(([id,l])=>{ if(l&&l.free&&!cloud.logs[id]){ cloud.logs[id]=l; n++; } });
  if(local.active && !cloud.active){ cloud.active=local.active; n++; }
  if(local.customEx) cloud.customEx=Object.assign({},local.customEx,cloud.customEx||{});
  return n;
}
async function syncFromCloud(){ await pullCloud(); applyProgramState(); renderAll(); }
function setSync(st){ if(!syncEl) syncEl=document.getElementById('syncDot'); if(!syncEl) return;
  const m={saving:['●','var(--warn)','저장 중'],saved:['●','var(--ok)','동기화됨'],error:['●','var(--bad)','동기화 오류'],local:['●','var(--mut)','로컬']};
  const x=m[st]||m.local; syncEl.style.color=x[1]; syncEl.title=x[2]; }
function seedState(){
  // build logs from HISTORY_SEED grouped by session id
  const logs={}; const bydate={};
  HISTORY_SEED.forEach(h=>{
    const sid=h.day.split(' ')[0];
    if(!logs[sid]) logs[sid]={ sessionId:sid, date:seedDate(h.date), sets:[] };
    logs[sid].sets.push({exercise:h.exercise,setIndex:h.setIndex,load:h.load,
      reps:h.actualReps,rpe:rpeNum(h.rpe)});
  });
  // mark seeded sessions complete
  Object.values(logs).forEach(l=>l.completed=true);
  // resume index = after last seeded session in SESSIONS order
  let resume=0;
  SESSIONS.forEach((s,i)=>{ if(logs[s.id]) resume=i+1; });
  if(resume>=SESSIONS.length) resume=SESSIONS.length-1;
  return { currentIdx:resume, logs, daily:{}, draft:{}, overrides:{} };
}
function seedDate(yymmdd){ if(!yymmdd) return null;
  const s=String(yymmdd); if(s.length<6) return null;
  return '20'+s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4,6); }

if(!state.overrides) state.overrides={};
let curTab='today';
let statsMonth=todayISO().slice(0,7); // 'YYYY-MM' 달력 표시 월

/* ===== Exercise swap (override) ===== */
function displayName(sid,origName){ return (state.overrides[sid]||{})[origName] || origName; }
function openSwap(sid,origName){
  const cur=displayName(sid,origName);
  const g=groupOf(origName);
  const alts=altsFor(origName);
  let list = alts.map(a=>`<button onclick="doSwap('${sid}',${jstr(origName)},${jstr(a)})" ${norm(a)===norm(cur)?'style=\"border-color:var(--accent);color:var(--accent)\"':''}>${a}${norm(a)===norm(cur)?' ✓':''}</button>`).join('');
  const orig = norm(cur)!==norm(origName) ? `<div class="row"><button class="close" onclick="doSwap('${sid}',${jstr(origName)},null)">↩︎ 원래 운동으로 (${origName})</button></div>` : '';
  showModal(`<h3>✏️ 운동명 직접 입력 / 수정</h3>
    <div class="muted" style="margin:-6px 0 10px;text-align:left">아래 칸에 원하는 운동명을 적고 "적용"을 누르세요. 세트·반복 구성은 유지됩니다.</div>
    <input id="swapCustom" type="text" placeholder="예: 스미스머신 스쿼트" value="${cur.replace(/"/g,'&quot;')}"
      style="width:100%;background:var(--card2);border:1px solid var(--accent);color:var(--txt);border-radius:11px;padding:14px;font-size:16px;margin-bottom:8px">
    <button class="close" style="width:100%;padding:14px;font-weight:800" onclick="doSwapCustom('${sid}',${jstr(origName)})">✓ 이 이름으로 적용</button>
    <div class="muted" style="text-align:left;margin:16px 2px 6px">또는 같은 부위(${g||'대체'})에서 선택:</div>

    ${orig}
    <div class="row" style="margin-top:14px"><button onclick="closeModal()">닫기</button></div>`);
}
function doSwapCustom(sid,origName){
  const v=(document.getElementById('swapCustom').value||'').trim();
  if(!v){ toast('운동명을 입력하세요'); return; }
  doSwap(sid,origName,v);
}
function doSwap(sid,origName,newName){
  if(!state.overrides[sid]) state.overrides[sid]={};
  if(newName===null || norm(newName)===norm(origName)) delete state.overrides[sid][origName];
  else state.overrides[sid][origName]=newName;
  saveState(state); closeModal(); renderToday(); toast(newName?'운동 교체됨':'원래 운동으로 복귀');
}

/* ===== Helpers ===== */
function rpeNum(r){ if(r==null) return null; let x=String(r).replace('@','').trim();
  if(x===''||x==='-') return null;
  if(x.includes('~')){const[a,b]=x.split('~').map(Number);return (a+b)/2;}
  const n=Number(x); return isNaN(n)?null:n; }
function todayISO(){ const d=new Date(); // 로컬(한국) 날짜 기준
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return ''; const[y,m,d]=iso.split('-'); return `${m}/${d}`; }
function dows(iso){ if(!iso) return ''; const days=['일','월','화','수','목','금','토'];
  return days[new Date(iso+'T00:00').getDay()]; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
function parseIntReps(r){ const n=parseInt(String(r)); return isNaN(n)?null:n; }

/* ===== Suggestion engine =====
   같은 운동+세트 위치의 가장 최근 수행을 보고 다음 중량/반복을 제안 */
function priorLogsFor(exName,setIndex,beforeIdx){
  const out=[];
  for(let i=0;i<SESSIONS.length;i++){
    if(i>=beforeIdx) continue;
    const log=state.logs[SESSIONS[i].id];
    if(!log) continue;
    log.sets.forEach(st=>{
      if(st.exercise===exName && st.setIndex===setIndex && typeof st.load==='number' && st.reps!=null)
        out.push({idx:i, date:log.date, ...st});
    });
  }
  out.sort((a,b)=> b.idx-a.idx); // most recent program-order first
  return out;
}
function suggest(exName,setIndex,plannedLoad,targetReps,targetRpeStr,beforeIdx){
  const tReps=parseIntReps(targetReps);
  const tRpe=rpeNum(targetRpeStr);
  const priors=priorLogsFor(exName,setIndex,beforeIdx);
  const step=stepForEquip(exName);
  if(!priors.length){
    return { load:plannedLoad, reps:tReps, reason:'기록 없음 · 계획값', planned:plannedLoad };
  }
  const last=priors[0];
  let load=last.load, reps=tReps||last.reps, reason='';
  const met = tReps==null ? true : last.reps>=tReps;
  const rpeOK = (last.rpe==null||tRpe==null) ? true : last.rpe<=tRpe;
  const bigRoom = (tRpe!=null&&last.rpe!=null&&(tRpe-last.rpe)>=1.5) || (tReps!=null&&(last.reps-tReps)>=3);
  if(met && rpeOK){
    if(bigRoom){ load=last.load+2*step; reason=`지난 ${last.load}kg×${last.reps}${last.rpe?` @${last.rpe}`:''} 여유 → +${2*step}kg`; }
    else { load=last.load+step; reason=`지난 ${last.load}kg×${last.reps} 달성 → +${step}kg`; }
  } else if(met && !rpeOK){
    load=last.load; reason=`반복 달성·RPE 높음(${last.rpe}) → 무게 유지`;
  } else {
    if(last.rpe!=null && last.rpe>=9){ load=Math.max(step, last.load-step); reason=`반복 미달·고RPE → -${step}kg`; }
    else { load=last.load; reason=`지난 ${last.load}kg×${last.reps} 반복 미달 → 유지`; }
  }
  const grid = equipOf(exName)==='dumbbell'?1:2.5; // 덤벨 1kg / 바벨·케이블 2.5kg 그리드
  load=roundStep(load,grid);
  return { load, reps, reason, planned:plannedLoad };
}

/* ===== Draft (in-progress logging) ===== */
function draftKey(sid){ return sid; }
function getDraft(sid){ if(!state.draft[sid]) state.draft[sid]={}; return state.draft[sid]; }
function setCell(sid,exName,si,field,val){

/* ===== Render: today ===== */
function renderToday(){
  if(isFree()) return renderFree();
  const s=SESSIONS[state.currentIdx];
  const day=state.daily[todayISO()]||{};
  const completed = state.logs[s.id] && state.logs[s.id].completed;
  let html='';

  html+=conditionCard(day);
  html+=nutriSummaryCard();

  // exercises
  const groups=[['warmup','워밍업 / 가동성'],['work','메인 운동'],['cardio','유산소 (선택)'],['cooldown','마무리']];
  groups.forEach(([type,title])=>{
    const exs=s.exercises.filter(e=>e.type===type);

    if(type==='work'){ exs.forEach(ex=> html+=renderEx(s,ex)); }
    else if(type==='cardio'){ exs.forEach(ex=> html+=renderCardio(ex)); }
    else { html+=`<div class="twogrid">`+exs.map(ex=>renderEx(s,ex)).join('')+`</div>`; } // 워밍업·마무리 2컬럼
  });

  // finish
  html+=`<div class="finishbar">
    <button class="bigbtn ${completed?'done':''}" onclick="finishSession()">

    </button>
    ${completed?`<div class="muted">${fmtDate(state.logs[s.id].date)} 기록됨 — 수정 후 다시 저장 가능</div>`:''}
  </div>`;

  document.getElementById('view-today').innerHTML=html;

// 오늘 체중 + 컨디션 카드 (두 모드 공통)

let condOpen=false;
function toggleCond(){ condOpen=!condOpen;
  document.getElementById('condBody').classList.toggle('hidden',!condOpen);

function metricSel(key,label,val,opts,unit){

  opts.forEach(n=> o+=`<option value="${n}" ${String(val)===String(n)?'selected':''}>${n}${unit||''}</option>`);

}
function saveDaily(field,val){ const t=todayISO(); if(!state.daily[t]) state.daily[t]={};
  state.daily[t][field]= val===''?undefined:(isNaN(Number(val))?val:Number(val)); saveState(state); }

/* ===== 세트 수 조정 (세션별·종목별) =====
   state.setCount[세션id][원래 운동명] = 세트 수. 늘리면 마지막 세트 구성을 복사한다. */
const SET_MIN=1, SET_MAX=10;
function setsOf(sid,ex){
  const n=((state.setCount||{})[sid]||{})[ex.name];
  if(n==null||ex.type!=='work') return ex.sets;
  if(n<=ex.sets.length) return ex.sets.slice(0,n);
  const last=ex.sets[ex.sets.length-1];
  return ex.sets.concat(Array.from({length:n-ex.sets.length},()=>Object.assign({},last,{extra:true})));
}
function changeSets(sid,origName,delta){
  const s=SESSIONS.find(x=>x.id===sid); const ex=s&&s.exercises.find(e=>e.name===origName); if(!ex) return;
  const n=Math.min(SET_MAX,Math.max(SET_MIN,setsOf(sid,ex).length+delta));
  if(!state.setCount) state.setCount={};
  if(!state.setCount[sid]) state.setCount[sid]={};
  if(n===ex.sets.length) delete state.setCount[sid][origName]; else state.setCount[sid][origName]=n;
  saveState(state); renderToday();
  toast(delta>0?`세트 추가 · ${n}세트`:`세트 빼기 · ${n}세트`);
}
function renderEx(s,ex){
  const isWork=ex.type==='work';
  const cls=ex.type;
  const dn = isWork ? displayName(s.id, ex.name) : ex.name; // 교체된 운동명
  const swapped = isWork && norm(dn)!==norm(ex.name);
  let rows='';
  const sets=setsOf(s.id,ex);
  if(isWork){
    rows+=`<div class="sethdr"><div class="c">#</div><div class="c">중량 kg</div><div class="c">반복</div><div class="c">RPE</div><div class="c">✓</div></div>`;
  }
  sets.forEach((set,i)=>{
    const si=i+1;
    const plannedLoad = typeof set.load==='number'?set.load:null;
    if(isWork){
      const sg=suggest(dn,si,plannedLoad,set.reps,set.rpe,state.currentIdx);
      const lg=loggedSet(s.id,dn,si); // 저장된 기록(있으면 편집 기준)
      const curLoad = cellVal(s.id,dn,si,'load') ?? (lg&&lg.load!=null?lg.load:(sg.load??''));
      const curReps = cellVal(s.id,dn,si,'reps') ?? (lg&&lg.reps!=null?lg.reps:(sg.reps??''));
      const curRpe = cellVal(s.id,dn,si,'rpe') ?? (lg&&lg.rpe!=null?lg.rpe:'');
      const isDone = !!cellVal(s.id,dn,si,'done'); // 오직 내가 탭한 것만 체크됨 (시작은 빈 칸)
      rows+=`<div class="setrow ${isDone?'done':''}">
        <div class="setno">${si}${set.extra?'<div style="font-size:8.5px;color:var(--accent)">추가</div>':''}</div>
        <div class="cell"><input type="number" inputmode="decimal" step="${stepForEquip(dn)}" value="${curLoad}"
            oninput="setCell('${s.id}',${jstr(dn)},${si},'load',numv(this.value))">
          <div class="tgt">계획 ${plannedLoad??'-'}</div></div>
        <div class="cell"><input type="number" inputmode="numeric" value="${curReps}"
            oninput="setCell('${s.id}',${jstr(dn)},${si},'reps',numv(this.value))">
          <div class="tgt">목표 ${set.reps}</div></div>
        <div class="cell">${rpeSelect(s.id,dn,si,curRpe)}
          <div class="tgt">${set.rpe||'-'}</div></div>
        <button class="donebtn ${isDone?'on':''}" aria-label="세트 완료" onclick="toggleDone('${s.id}',${jstr(dn)},${si})"></button>
      </div>`;
      rows+=`<div class="suggest">💡 ${sg.reason} ${sg.planned!=null?`<span class="pchip">계획 ${sg.planned}kg</span>`:''}</div>`;
    } else {
      rows+=`<div class="setrow" style="grid-template-columns:26px 1fr">
        <div class="setno">${si}</div>
        <div style="font-size:13px;color:var(--sub);padding:4px 0">${set.reps}${set.load&&set.load!=='BW'&&set.load!=='-'?` · ${set.load}`:''} ${set.load==='BW'?'(맨몸)':''}</div>
      </div>`;
    }
  });
  if(isWork){
    const base=ex.sets.length, n=sets.length;
    rows+=`<div class="setctl">
      <button onclick="changeSets('${s.id}',${jstr(ex.name)},-1)" ${n<=SET_MIN?'disabled':''}>− 세트</button>
      <div class="cnt ${n!==base?'chg':''}"><b>${n}세트</b>${n!==base?`<br>계획 ${base}세트`:''}</div>
      <button onclick="changeSets('${s.id}',${jstr(ex.name)},1)" ${n>=SET_MAX?'disabled':''}>+ 세트</button>
    </div>`;
  }
  // 같은 부위 대체운동 추천 라인
  let recLine='';
  if(isWork){
    const alts=altsFor(dn).slice(0,4);
    if(alts.length) recLine=`<div class="rec" onclick="openSwap('${s.id}',${jstr(ex.name)})">🔄 같은 부위 대체: ${alts.join(' · ')}${altsFor(dn).length>4?' …':''}</div>`;
  }
  const swapBtn = isWork ? `<button class="swapbtn ${swapped?'on':''}" onclick="openSwap('${s.id}',${jstr(ex.name)})">🔄 바꾸기</button>` : '';
  return `<div class="ex ${cls} ${isWork?'':'warm'}">
    <div class="exhead">
      <div><div class="exname">${dn}${swapped?` <span class="swaptag">교체됨</span>`:''}</div>
        <div class="exmeta">${sets.length}세트 ${isWork?'· '+sets.map(x=>x.reps).join('/')+'회':''}${ex.note?' · '+ex.note:''}${swapped?` · 원래: ${ex.name}`:''}</div></div>
      ${swapBtn}
    </div>
    ${recLine}
    <div class="sets">${rows}</div>
  </div>`;
}
// HTML 속성(큰따옴표) 안에서 안전한 JS 문자열 리터럴(작은따옴표) 생성.
// JSON.stringify는 큰따옴표로 감싸 onclick="..." 속성을 깨뜨리므로 직접 이스케이프한다.
function jstr(s){ return "'"+String(s).replace(/&/g,'&amp;').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')+"'"; }
function numv(v){ if(v===''||v==null) return undefined; const n=Number(v); return isNaN(n)?v:n; }
function rpeSelect(sid,exName,si,cur){
  let o='<option value="">–</option>';
  for(let r=6;r<=10;r+=0.5){ o+=`<option value="${r}" ${String(cur)===String(r)?'selected':''}>${r}</option>`; }
  return `<select class="rpe-sel" onchange="setCell('${sid}',${jstr(exName)},${si},'rpe',numv(this.value))">${o}</select>`;
}
function loggedSet(sid,exName,si){
  const lg=state.logs[sid]; if(!lg||!lg.sets) return null;
  return lg.sets.find(x=>x.exercise===exName && x.setIndex===si) || null;
}
function toggleDone(sid,exName,si){
  const session=SESSIONS.find(x=>x.id===sid);
  const lg=loggedSet(sid,exName,si);
  const next=!cellVal(sid,exName,si,'done');
  if(next){
    // 체크 시 현재 표시값(입력 or 추천 or 기록)을 draft에 고정 → 그 세트만 저장됨
    let set=null;
    if(session){ for(const ex of session.exercises){ const dn=displayName(sid,ex.name);
      if(dn===exName){ set=setsOf(sid,ex)[si-1]; break; } } }
    const planned = set&&typeof set.load==='number'?set.load:null;
    const sg = set?suggest(exName,si,planned,set.reps,set.rpe,state.currentIdx):{load:null,reps:null};
    if(cellVal(sid,exName,si,'load')==null) setCell(sid,exName,si,'load', lg&&lg.load!=null?lg.load:sg.load);
    if(cellVal(sid,exName,si,'reps')==null) setCell(sid,exName,si,'reps', lg&&lg.reps!=null?lg.reps:sg.reps);
  }
  setCell(sid,exName,si,'done',next);
  renderToday();
}
function finishSession(){
  const s=SESSIONS[state.currentIdx];
  const dk=state.draft[s.id]||{};
  const wasCompleted = state.logs[s.id] && state.logs[s.id].completed;
  const sets=[];
  s.exercises.filter(e=>e.type==='work').forEach(ex=>{
    const dn=displayName(s.id,ex.name);
    setsOf(s.id,ex).forEach((set,i)=>{
      const si=i+1; const c=dk[dn+'#'+si]||{};
      const lg=loggedSet(s.id,dn,si);
      if(c.done!==true) return; // ✅ 내가 체크한 세트만 저장
      const sg=suggest(dn,si,typeof set.load==='number'?set.load:null,set.reps,set.rpe,state.currentIdx);
      const load = c.load ?? (lg&&lg.load!=null?lg.load:sg.load);
      const reps = c.reps ?? (lg&&lg.reps!=null?lg.reps:sg.reps);
      const rpe  = c.rpe!=null?Number(c.rpe):(lg&&lg.rpe!=null?lg.rpe:null);
      sets.push({exercise:dn,orig:(norm(dn)!==norm(ex.name)?ex.name:undefined),setIndex:si,
        load:(typeof load==='number'?load:null), reps:parseIntReps(reps), rpe});
    });
  });
  if(!sets.length){ toast('완료 체크된 세트가 없습니다'); return; }
  const prevDate = wasCompleted ? state.logs[s.id].date : todayISO();
  state.logs[s.id]={ sessionId:s.id, date:prevDate, sets, completed:true };
  saveState(state);
  toast(wasCompleted ? '수정 저장됨 ✓' : `세션 기록 완료 ✓ (${sets.length}세트)`);
  if(!wasCompleted){ // 처음 완료할 때만 다음 세션으로 이동
    let nxt=state.currentIdx+1;
    if(nxt<SESSIONS.length) state.currentIdx=nxt;
  }
  renderAll(); window.scrollTo(0,0);
}

/* ===== 자유 운동 모드 =====
   정해진 프로그램 없이 그날 하고 싶은 운동(빈 기구)을 바로 골라 기록한다.
   state.mode   : 'free'(기본) | 'program'(16주 프로그램)
   state.active : 진행 중인 운동 {id, startAt, lastSetAt, exercises:[{name, sets:[{load,reps,rpe | min, done, at}]}]}
                  기록 수정 중이면 editing:true, endAt 포함
   종료 시 state.logs[id] = {sessionId:id, free:true, date, startAt, endAt, sets:[...], completed:true}
   (startAt·endAt은 ms 타임스탬프, ✓ 체크한 세트만 저장) */
function isFree(){ return (state.mode||'free')==='free'; }
function setMode(m){
  state.mode=m; saveState(state); closeModal();
  switchTab(curTab); renderAll(); window.scrollTo(0,0);
  toast(m==='free'?'자유 운동 모드':'16주 프로그램 모드');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ymdOf(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hmOf(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function atHM(dateISO,hmStr){ const[h,m]=String(hmStr).split(':').map(Number); const d=new Date(dateISO+'T00:00'); d.setHours(h||0,m||0,0,0); return d.getTime(); }
function durMin(a,b){ return Math.max(0,Math.round((b-a)/60000)); }
function durText(min){ return min>=60?`${Math.floor(min/60)}시간 ${min%60}분`:`${min}분`; }
function clock(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s).padStart(2,'0'); }
function setText(st){
  if(st.min!=null) return st.min+'분';
  if(st.load!=null && st.reps!=null) return st.load+'×'+st.reps;
  if(st.load!=null) return st.load+'kg';
  if(st.reps!=null) return st.reps+'회';
  return '-';
}

/* 기록 조회: 최신순 정렬, 운동별 지난 기록 */
function sortedLogs(){
  return Object.entries(state.logs).map(([id,l])=>({id,l})).filter(x=>x.l&&Array.isArray(x.l.sets))
    .sort((a,b)=>{ const da=a.l.date||'', db=b.l.date||''; if(da!==db) return da<db?1:-1; return (b.l.startAt||0)-(a.l.startAt||0); });
}
function lastPerfIndex(excludeId){ // {기록명: {date, sets}} — 운동마다 가장 최근 1회
  const idx={};
  sortedLogs().forEach(({id,l})=>{ if(id===excludeId) return;
    const seen={};
    l.sets.forEach(st=>{ const c=canon(st.exercise); if(idx[c]&&!seen[c]) return;
      if(!idx[c]){ idx[c]={date:l.date,sets:[]}; seen[c]=true; }
      idx[c].sets.push(st); });
  });
  Object.values(idx).forEach(v=>v.sets.sort((a,b)=>a.setIndex-b.setIndex));
  return idx;
}
function lastPerf(name,excludeId){ return lastPerfIndex(excludeId)[canon(name)]||null; }
function recentExercises(limit){
  const seen=new Set(), out=[];
  sortedLogs().forEach(({l})=>l.sets.forEach(st=>{ const c=canon(st.exercise); if(!seen.has(c)){ seen.add(c); out.push(c); } }));
  return out.slice(0,limit);
}
function todayFreeLogs(){ return sortedLogs().filter(x=>x.l.free&&x.l.date===todayISO()).reverse(); }

/* 시작 · 종료 */
function startFree(silent){
  if(state.active) return;
  const now=Date.now(), d=new Date(now), p2=n=>String(n).padStart(2,'0');
  const id='F'+ymdOf(now).replace(/-/g,'')+'-'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds());
  state.active={id,startAt:now,exercises:[]};
  saveState(state); switchTab('today'); renderSess();
  if(!silent) toast(`운동 시작 ${hmOf(now)}`);
}
function setFreeStart(v){
  const a=state.active; if(!a||!/^\d{1,2}:\d{2}$/.test(v)) return;
  let t=atHM(ymdOf(a.startAt),v);
  if(t>Date.now()) t-=86400000; // 자정을 넘겨 운동 중일 때 → 전날 시각
  a.startAt=t; saveState(state); renderSess(); toast('시작 시각 '+v);
}
function collectSets(a){ // ✓ 체크한 세트만
  const sets=[];
  a.exercises.forEach(e=>{ const cardio=isCardio(e.name); let k=0;
    e.sets.forEach(st=>{ if(!st.done) return; k++;
      if(cardio) sets.push({exercise:e.name,setIndex:k,load:null,reps:null,rpe:null,min:typeof st.min==='number'?st.min:null});
      else sets.push({exercise:e.name,setIndex:k,load:typeof st.load==='number'?st.load:null,
        reps:parseIntReps(st.reps),rpe:(st.rpe!=null&&st.rpe!=='')?Number(st.rpe):null});
    });
  });
  return sets;
}
function endFree(endAt){
  const a=state.active; if(!a) return;
  const sets=collectSets(a);
  const pending=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);
  if(a.editing){ // 지난 기록 세트 수정 → 시간은 그대로 두고 세트만 교체
    if(!sets.length){
      if(!confirm('완료 체크된 세트가 없습니다. 이 기록을 삭제할까요?')) return;
      delete state.logs[a.id];
    } else {
      const lg=state.logs[a.id]||{sessionId:a.id,free:true,date:ymdOf(a.startAt),startAt:a.startAt,endAt:a.endAt,completed:true};
      lg.sets=sets; state.logs[a.id]=lg;
    }
    state.active=null; saveState(state); renderAll(); window.scrollTo(0,0); toast('수정 저장됨 ✓'); return;
  }
  const end=endAt||Date.now();
  if(!sets.length){
    if(confirm('완료 체크(✓)한 세트가 없습니다.\n기록 없이 이번 운동을 끝낼까요?')){
      state.active=null; saveState(state); renderAll(); toast('운동 종료 (기록 없음)'); }
    return;
  }
  const min=durMin(a.startAt,end);
  if(!endAt && !confirm(`운동을 종료할까요?\n${hmOf(a.startAt)} → ${hmOf(end)} · ${durText(min)} · ${sets.length}세트 저장`+
      (pending?`\n(✓ 안 한 ${pending}세트는 저장되지 않아요)`:''))) return;
  state.logs[a.id]={sessionId:a.id, free:true, date:ymdOf(a.startAt), startAt:a.startAt, endAt:end, sets, completed:true};
  state.active=null; saveState(state); renderAll(); window.scrollTo(0,0);
  toast(`운동 기록 저장 ✓ ${durText(min)} · ${sets.length}세트`);
}
function endFreeAt(){ // 종료를 깜빡한 운동: 종료 시각을 정해서 저장
  const a=state.active, v=(document.getElementById('staleEnd')||{}).value; if(!a||!v) return;
  let t=atHM(ymdOf(a.startAt),v); if(t<=a.startAt) t+=86400000; if(t>Date.now()) t=Date.now();
  endFree(t);
}
function cancelFree(){
  const a=state.active; if(!a) return;
  if(a.editing){ state.active=null; saveState(state); renderAll(); toast('수정 취소'); return; }
  const done=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  if(!confirm(done?`완료한 ${done}세트까지 이번 운동 기록을 모두 버릴까요?`:'이번 운동을 취소할까요?')) return;
  state.active=null; saveState(state); renderAll(); toast('운동 취소됨');
}

/* 운동 · 세트 조작 */
function addFreeEx(name){
  name=String(name||'').trim(); if(!name) return;
  const auto=!state.active;
  if(auto) startFree(true);
  const a=state.active;
  const found=a.exercises.findIndex(e=>canon(e.name)===canon(name));
  if(found>=0){ closeModal(); renderToday(); scrollToEx(found); toast('이미 추가된 운동이에요'); return; }
  const cardio=isCardio(name), lp=lastPerf(name,a.id);
  // 지난번 세트 구성을 그대로 채워 둔다 → 같으면 ✓만 누르면 됨
  const sets = (lp&&lp.sets.length)
    ? lp.sets.slice(0,6).map(st=>cardio?{min:st.min!=null?st.min:null}:{load:st.load!=null?st.load:null,reps:st.reps!=null?st.reps:null})
    : [cardio?{min:null}:{load:null,reps:null}];
  a.exercises.push({name,sets});
  saveState(state); closeModal(); renderAll(); scrollToEx(a.exercises.length-1);
  toast(auto?`운동 시작 ${hmOf(a.startAt)} · ${exLabel(name)}`:`${exLabel(name)} 추가`);
}
function addCustomEx(name,g){
  name=String(name||'').trim(); if(!name) return;
  if(!CAT_GROUP[canon(name)]){ if(!state.customEx) state.customEx={}; state.customEx[name]=(g&&g!=='기타'&&g!=='최근')?g:null; }
  addFreeEx(name);
}
function scrollToEx(i){ setTimeout(()=>{ const el=document.getElementById('fx'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); },60); }
function frEx(i){ const a=state.active; return a?a.exercises[i]:null; }
function frSetOf(i,j){ const e=frEx(i); return e?e.sets[j]:null; }
function frCell(i,j,field,val){ const st=frSetOf(i,j); if(!st) return;
  if(val===undefined) delete st[field]; else st[field]=val; saveState(state); }
function recalcLastSet(){ const a=state.active; if(!a) return; let m=0;
  a.exercises.forEach(e=>e.sets.forEach(s=>{ if(s.done&&s.at>m) m=s.at; })); a.lastSetAt=m||null; }
function frDone(i,j){
  const st=frSetOf(i,j); if(!st) return;
  st.done=!st.done; if(st.done) st.at=Date.now(); else delete st.at;
  recalcLastSet(); saveState(state); renderToday(); renderSess();
}
function frAddSet(i){
  const e=frEx(i); if(!e) return; const last=e.sets[e.sets.length-1]||{};
  e.sets.push(isCardio(e.name)?{min:last.min!=null?last.min:null}:{load:last.load!=null?last.load:null,reps:last.reps!=null?last.reps:null});
  saveState(state); renderToday();
}
function frDelSet(i){
  const e=frEx(i); if(!e||e.sets.length<=1) return; const last=e.sets[e.sets.length-1];
  if(last.done && !confirm('완료 체크한 마지막 세트를 지울까요?')) return;
  e.sets.pop(); recalcLastSet(); saveState(state); renderToday(); renderSess();
}
function removeFreeEx(i){
  const e=frEx(i); if(!e) return;
  const done=e.sets.filter(s=>s.done).length;
  if(!confirm(done?`${exLabel(e.name)} — 완료한 ${done}세트까지 빼버릴까요?`:`${exLabel(e.name)}을(를) 목록에서 뺄까요?`)) return;
  state.active.exercises.splice(i,1); recalcLastSet(); saveState(state); renderToday(); renderSess();
}

/* 화면: 상단 바 (시작 버튼 / 경과 시간 · 휴식 타이머 / 종료 버튼) */
function restText(){ const a=state.active; return (a&&a.lastSetAt)?` · 휴식 <span class="rest">${clock((Date.now()-a.lastSetAt)/1000)}</span>`:''; }
function renderFreeHeader(){
  const el=document.getElementById('sessSel'); el.className='frbar';
  const a=state.active;
  if(a && a.editing){
    const d=ymdOf(a.startAt);
    el.innerHTML=`<div class="frpill edit"><div class="l1">✏️ 기록 수정 중</div>
        <div class="l2">${fmtDate(d)} (${dows(d)}) ${hmOf(a.startAt)}${a.endAt?'–'+hmOf(a.endAt):''}</div></div>
      <button class="frbtn save" onclick="endFree()">저장</button>`;
  } else if(a){
    el.innerHTML=`<div class="frpill live"><div class="l1">⏱ <span id="frElapsed">${clock((Date.now()-a.startAt)/1000)}</span></div>
        <div class="l2">${hmOf(a.startAt)} 시작<span id="frRest">${restText()}</span></div></div>
      <button class="frbtn stop" onclick="endFree()">■ 종료</button>`;
  } else {
    const td=todayFreeLogs();
    el.innerHTML=`<div class="frpill"><div class="l1">${td.length?'오늘 운동 완료 ✓':'운동 전'}</div>
        <div class="l2">${td.length?td.map(x=>hmOf(x.l.startAt)+'–'+hmOf(x.l.endAt)).join(', '):'자유 운동 · 하고 싶은 운동을 바로 기록'}</div></div>
      <button class="frbtn" onclick="startFree()">▶ 시작</button>`;
  }
}
setInterval(()=>{ // 경과 시간 · 휴식 타이머만 갱신 (입력 중인 칸은 건드리지 않음)
  if(!isFree()||!state.active||state.active.editing) return;
  const e=document.getElementById('frElapsed'); if(e) e.textContent=clock((Date.now()-state.active.startAt)/1000);
  const r=document.getElementById('frRest'); if(r) r.innerHTML=restText();
},1000);

/* 화면: 오늘 탭 (자유 운동) */
function renderFree(){
  const a=state.active, day=state.daily[todayISO()]||{};
  let html='';
  if(a){
    if(!a.editing && Date.now()-a.startAt>5*3600*1000){ // 종료를 깜빡하고 5시간 넘게 지난 경우
      const def=a.lastSetAt?a.lastSetAt+5*60000:a.startAt+60*60000;
      html+=`<div class="card" style="border-color:var(--warn)">
        <h3 style="color:var(--warn)">⚠️ ${fmtDate(ymdOf(a.startAt))} ${hmOf(a.startAt)}에 시작한 운동이 아직 진행 중이에요</h3>
        <div class="timecard"><span>실제 종료</span><input id="staleEnd" type="time" value="${hmOf(def)}">
          <button class="frbtn stop" style="height:40px;margin-left:auto" onclick="endFreeAt()">이 시각으로 종료</button></div></div>`;
    }
    const nDone=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
    html+=`<div class="card timecard">
      ${a.editing?`<span>${hmOf(a.startAt)} → ${a.endAt?hmOf(a.endAt):'-'}</span><span class="muted" style="margin:0">시간은 기록 탭에서 수정</span>`
        :`<span>시작</span><input type="time" value="${hmOf(a.startAt)}" onchange="setFreeStart(this.value)"><span>→ 진행 중</span>`}
      <span style="margin-left:auto;white-space:nowrap">${a.exercises.length}종목 · ✓${nDone}세트</span></div>`;
    if(!a.exercises.length) html+=`<div class="empty" style="padding:22px 10px">아래 <b style="color:var(--txt)">+ 운동 추가</b>를 눌러<br>지금 할 운동(빈 기구)을 고르세요.</div>`;
    const lpi=lastPerfIndex(a.id);
    a.exercises.forEach((e,i)=> html+=renderFreeEx(e,i,lpi[canon(e.name)]));
    html+=`<button class="addbtn" onclick="openPicker()">+ 운동 추가</button>`;
    html+=`<div class="finishbar">
      <button class="bigbtn ${a.editing?'':'done'}" onclick="endFree()">${a.editing?'✓ 수정 저장':'■ 운동 종료 · 기록 저장'}</button>
      <button class="bigbtn ghost" style="margin-top:8px" onclick="cancelFree()">${a.editing?'수정 취소':'운동 취소 (기록 버리기)'}</button></div>`;
    html+=conditionCard(day)+nutriSummaryCard();
  } else {
    html+=`<button class="startbig" onclick="startFree()">▶ 운동 시작</button>
      <div class="muted" style="margin:0 0 4px">시작 시각이 기록돼요. 바로 <b>+ 운동 추가</b>를 눌러도 그때 시작됩니다.</div>
      <button class="addbtn" onclick="openPicker()">+ 운동 추가</button>`;
    const td=todayFreeLogs();
    if(td.length){
      html+=`<div class="sectlabel">오늘 한 운동</div><div class="donelist">`+td.map(({id,l})=>{
        const nEx=new Set(l.sets.map(x=>x.exercise)).size;
        return `<div class="hcard" onclick="openLogEdit(${jstr(id)})"><div class="top">
          <b>✓ ${hmOf(l.startAt)}–${hmOf(l.endAt)} · ${durText(durMin(l.startAt,l.endAt))}</b>
          <span class="d">${nEx}종목 ${l.sets.length}세트 ✏️</span></div>
          <div class="sets-sm">${[...new Set(l.sets.map(x=>exLabel(x.exercise)))].map(esc).join(' · ')}</div></div>`; }).join('')+`</div>`;
    }
    html+=conditionCard(day)+nutriSummaryCard();
  }
  document.getElementById('view-today').innerHTML=html;
}
function frRpe(i,j,cur){
  let o='<option value="">–</option>';
  for(let r=6;r<=10;r+=0.5){ o+=`<option value="${r}" ${String(cur)===String(r)?'selected':''}>${r}</option>`; }
  return `<select class="rpe-sel" onchange="frCell(${i},${j},'rpe',numv(this.value))">${o}</select>`;
}
function renderFreeEx(e,i,lp){
  const cardio=isCardio(e.name);
  const done=e.sets.filter(s=>s.done).length;
  let rows = cardio
    ? `<div class="sethdr cardio"><div class="c">#</div><div class="c">시간 (분)</div><div class="c">✓</div></div>`
    : `<div class="sethdr"><div class="c">#</div><div class="c">중량 kg</div><div class="c">반복</div><div class="c">RPE</div><div class="c">✓</div></div>`;
  e.sets.forEach((st,j)=>{
    const btn=`<button class="donebtn ${st.done?'on':''}" aria-label="${j+1}세트 완료" onclick="frDone(${i},${j})"></button>`;
    if(cardio) rows+=`<div class="setrow cardio ${st.done?'done':''}"><div class="setno">${j+1}</div>
        <div class="cell"><input type="number" inputmode="numeric" placeholder="분" value="${st.min??''}" oninput="frCell(${i},${j},'min',numv(this.value))"></div>${btn}</div>`;
    else rows+=`<div class="setrow ${st.done?'done':''}"><div class="setno">${j+1}</div>
        <div class="cell"><input type="number" inputmode="decimal" step="any" placeholder="kg" value="${st.load??''}" oninput="frCell(${i},${j},'load',numv(this.value))"></div>
        <div class="cell"><input type="number" inputmode="numeric" placeholder="회" value="${st.reps??''}" oninput="frCell(${i},${j},'reps',numv(this.value))"></div>
        <div class="cell">${frRpe(i,j,st.rpe)}</div>${btn}</div>`;
  });
  rows+=`<div class="setctl"><button onclick="frDelSet(${i})" ${e.sets.length<=1?'disabled':''}>− 세트</button>
    <div class="cnt"><b>${done}/${e.sets.length}</b> 완료</div>
    <button class="addset" onclick="frAddSet(${i})">+ 세트</button></div>`;
  const lpText = lp?`지난번${lp.date?' '+fmtDate(lp.date):''}: ${lp.sets.map(setText).join(' · ')}`:'첫 기록';
  return `<div class="ex ${cardio?'cardio':'work'}" id="fx${i}">
    <div class="exhead"><div style="min-width:0"><div class="exname">${esc(exLabel(e.name))}<span class="gtag">${groupLabel(groupOf(e.name))}</span></div>
      <div class="exmeta">${lpText}</div></div>
      <button class="xbtn" aria-label="운동 빼기" onclick="removeFreeEx(${i})">✕</button></div>
    <div class="sets">${rows}</div></div>`;
}

/* 운동 선택 시트: 최근 운동 · 부위별 목록 · 한글/영문 검색 · 새 운동 직접 추가 */
let pkGroup='최근';
function openPicker(){
  showModal(`<h3>운동 추가</h3>
    <input id="pkQ" class="pkq" type="search" autocomplete="off" placeholder="검색 또는 새 운동 이름 (예: leg press, 레그)" oninput="renderPicker()">
    <div id="pkBody"></div>
    <div class="row" style="margin-top:12px"><button onclick="closeModal()">닫기</button></div>`);
  const sh=document.querySelector('#modalRoot .sheet'); if(sh) sh.classList.add('tall');
  renderPicker();
}
const PK_GROUPS=['최근',...FREE_CATALOG.map(x=>x[0]),'기타'];
function allExNames(){ // 기록명 → 부위 (목록 + 내가 추가한 운동 + 지난 기록에 있는 운동)
  const m=new Map();
  FREE_CATALOG.forEach(([g,list])=>list.forEach(([en])=>m.set(en,g)));
  const fix=g=>PK_GROUPS.includes(g)?g:'기타';
  Object.entries(customEx()).forEach(([n,g])=>{ if(!m.has(n)) m.set(n,fix(g)); });
  sortedLogs().forEach(({l})=>l.sets.forEach(st=>{ const c=canon(st.exercise); if(!m.has(c)) m.set(c,fix(groupOf(c))); }));
  return m;
}
function sKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9가-힣ㄱ-ㅎ]/g,''); }
function matchQ(name,q){ const k=sKey(q); return !k || sKey(name).includes(k) || sKey(koOf(name)).includes(k); }
function renderPicker(){
  const body=document.getElementById('pkBody'); if(!body) return;
  const qt=((document.getElementById('pkQ')||{}).value||'').trim();
  const a=state.active, inSess=new Set(((a&&a.exercises)||[]).map(e=>canon(e.name)));
  const all=allExNames(), lpi=lastPerfIndex(a&&a.id);
  let html=`<div class="chips">${PK_GROUPS.map(g=>`<button class="chip ${g===pkGroup?'on':''}" onclick="pkGroup=${jstr(g)};renderPicker()">${groupLabel(g)}</button>`).join('')}</div>`;
  let names;
  if(qt){
    names=[...all.keys()].filter(n=>matchQ(n,qt));
    const exact=names.some(n=>sKey(n)===sKey(qt)||sKey(koOf(n))===sKey(qt));
    if(!exact){
      const g=pkGroup==='최근'?'기타':pkGroup;
      html+=`<button class="pknew" onclick="addCustomEx(${jstr(qt)},${jstr(g)})">➕ 새 운동 “${esc(qt)}” 추가 · ${groupLabel(g)}</button>`;
      if(pkGroup==='최근') html+=`<div class="muted" style="margin:-4px 0 10px;text-align:left">위에서 부위를 먼저 누르면 그 부위로 저장돼요.</div>`;
    }
  } else if(pkGroup==='최근'){
    names=recentExercises(12);
    if(!names.length) html+=`<div class="muted" style="margin-bottom:8px">아직 기록이 없어요. 위에서 부위를 골라 보세요.</div>`;
  } else {
    names=[...all.entries()].filter(([,g])=>g===pkGroup).map(([n])=>n);
    if(!names.length) html+=`<div class="muted" style="margin-bottom:8px">직접 추가한 운동이 여기에 모여요. 위 검색칸에 이름을 적어 추가하세요.</div>`;
  }
  html+=`<div class="pkgrid">${names.slice(0,40).map(n=>{ const lp=lpi[canon(n)], on=inSess.has(canon(n));
    return `<button class="pkitem ${on?'in':''}" onclick="addFreeEx(${jstr(n)})">
      <span class="k">${esc(n)}${on?' ✓':''}</span>
      ${lp?`<span class="lp">${lp.date?fmtDate(lp.date)+' · ':''}${setText(lp.sets[0])}${lp.sets.length>1?` 외 ${lp.sets.length-1}세트`:''}</span>`:''}</button>`; }).join('')}</div>`;
  body.innerHTML=html;
}

/* 지난 자유 운동 기록: 날짜·시작·종료 시각 수정, 세트 수정, 삭제 */
function openLogEdit(id){
  const l=state.logs[id]; if(!l) return;
  const st=l.startAt||atHM(l.date,'00:00'), en=l.endAt||st;
  showModal(`<h3>✏️ ${fmtDate(l.date)} (${dows(l.date)}) 운동 기록</h3>
    <label class="f">날짜</label><input class="f" id="leDate" type="date" value="${l.date}">
    <div class="twogrid" style="margin-top:2px">
      <div><label class="f">시작</label><input class="f" id="leStart" type="time" value="${hmOf(st)}"></div>
      <div><label class="f">종료</label><input class="f" id="leEnd" type="time" value="${hmOf(en)}"></div></div>
    <div class="row" style="margin-top:12px"><button class="close" onclick="saveLogTime(${jstr(id)})">시간 저장</button></div>
    <div class="row"><button onclick="editLogSets(${jstr(id)})">🏋️ 세트 수정하기</button></div>
    <div class="row"><button class="danger" onclick="deleteLog(${jstr(id)})">🗑️ 이 기록 삭제</button></div>
    <div class="row"><button onclick="closeModal()">닫기</button></div>`);
}
function saveLogTime(id){
  const l=state.logs[id]; if(!l) return;
  const d=document.getElementById('leDate').value, s=document.getElementById('leStart').value, e=document.getElementById('leEnd').value;
  if(!d||!s||!e){ toast('날짜와 시각을 모두 입력하세요'); return; }
  const st=atHM(d,s); let en=atHM(d,e); if(en<=st) en+=86400000; // 자정 넘김
  l.date=d; l.startAt=st; l.endAt=en;
  saveState(state); closeModal(); renderAll(); toast(`저장됨 · ${durText(durMin(st,en))}`);
}
function deleteLog(id){
  if(!confirm('이 운동 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
  delete state.logs[id]; saveState(state); closeModal(); renderAll(); toast('기록 삭제됨');
}
function editLogSets(id){
  if(state.active){ toast(state.active.editing?'다른 기록을 수정 중이에요':'진행 중인 운동을 먼저 종료하세요'); return; }
  const l=state.logs[id]; if(!l) return;
  const exs=[], by={};
  l.sets.forEach(st=>{ let e=by[st.exercise]; if(!e){ e=by[st.exercise]={name:st.exercise,sets:[]}; exs.push(e); }
    e.sets.push(st.min!=null?{min:st.min,done:true}:{load:st.load,reps:st.reps,rpe:st.rpe!=null?st.rpe:undefined,done:true}); });
  state.active={id,editing:true,startAt:l.startAt||atHM(l.date,'00:00'),endAt:l.endAt||null,exercises:exs};
  saveState(state); closeModal(); switchTab('today'); renderSess(); toast('세트를 고친 뒤 저장을 누르세요');
}

/* ===== 영양 · 보충제 체크 =====
   state.nutriCfg: 운동·식사 시각과 보충제 양 (설정에서 변경)
   state.daily[날짜].nut: {항목id:true} · dayType: 'train'|'rest' · cardio: 분 */
const NUTRI_DEFAULT={workout:'06:30',breakfast:'07:30',lunch:'12:30',dinner:'18:30',scoop:25,creatine:5};
const TRAIN_DOW=[1,2,4,5]; // 권장 운동 요일: 월·화·목·금
function ncfg(){ return Object.assign({},NUTRI_DEFAULT,state.nutriCfg||{}); }
function toMin(hm){ const[h,m]=String(hm||'0:0').split(':').map(Number); return (h||0)*60+(m||0); }
function hm(min){ min=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function addDays(iso,n){ const d=new Date(iso+'T00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayTypeOf(iso){
  const d=state.daily[iso]||{};
  if(d.dayType) return d.dayType;
  if(Object.values(state.logs).some(l=>l.date===iso)) return 'train';
  if(state.active && !state.active.editing && ymdOf(state.active.startAt)===iso) return 'train';
  return TRAIN_DOW.includes(new Date(iso+'T00:00').getDay())?'train':'rest';
}
function nutriItems(iso){
  const c=ncfg(), train=dayTypeOf(iso)==='train', W=toMin(c.workout);
  const meal='밥 1~1.5공기 + 단백질 30~40g (고기·생선 손바닥 1.5개 또는 계란 3개) + 채소';
  let meals=[
    {id:'bf',t:toMin(c.breakfast),nm:'아침 식사',amt:'밥 1공기 + 계란 2~3개 또는 고기 100g'},
    {id:'lu',t:toMin(c.lunch),nm:'점심 식사',amt:meal},
    {id:'di',t:toMin(c.dinner),nm:'저녁 식사',amt:meal},
  ];
  const items=[];
  if(train){
    // 운동 직전(90분 전)~운동 직후에 걸친 식사는 운동 후로 미룬다
    meals.forEach(m=>{ if(m.t>=W-90 && m.t<W+75){ m.t=W+105; m.nm+=' (운동 후로 이동)'; } });
    const before=meals.filter(m=>m.t<W).map(m=>m.t);
    const last=before.length?Math.max(...before):null;
    if(last==null || W-last>180) items.push(W<9*60
      ? {id:'pre',t:W-45,nm:'운동 전 간식 (가볍게)',amt:'바나나 1개 또는 우유 1컵 — 공복 운동 피하기'}
      : {id:'pre',t:W-90,nm:'운동 전 간식',amt:'바나나 1개 + 우유 300ml 또는 그릭요거트 1컵 (탄수 40~60g · 단백질 15~20g)'});
    items.push({id:'post',t:W+75,nm:'운동 후 단백질 보충제',sup:true,
      amt:`1스쿱 (단백질 약 ${c.scoop}g) + 물 또는 우유 300ml · 운동 끝나고 1시간 안에`});
  } else {
    const L=toMin(c.lunch), D=toMin(c.dinner);
    items.push({id:'snack',t:D>L?Math.round((L+D)/2):15*60+30,nm:'오후 간식 + 단백질 보충제',sup:true,
      amt:`1스쿱 (단백질 약 ${c.scoop}g) + 우유 300ml 또는 견과류 한 줌`});
  }
  // 크레아틴은 아침 식사와 함께 (식사가 운동 후로 옮겨지면 같이 이동)
  items.push({id:'cr',t:meals[0].t,nm:'크레아틴',sup:true,
    amt:`크레아틴 모노하이드레이트 ${c.creatine}g + 물 300ml 이상 · 아침 식사와 함께 (쉬는 날도 매일)`});
  items.push(...meals);
  items.sort((a,b)=>a.t-b.t);
  items.push({id:'water',t:null,nm:'물 2.5~3L',amt:'하루 종일 나눠서 · 크레아틴 복용 중에는 특히 챙기기'});
  return items;
}
function nutriStatus(iso){
  const d=state.daily[iso]||{}, nut=d.nut||{}, items=nutriItems(iso);
  const done=items.filter(i=>nut[i.id]).length;
  return {any:Object.keys(nut).length>0||!!d.dayType, train:dayTypeOf(iso)==='train', done, total:items.length,
    creatine:!!nut.cr, shakes:(nut.post?1:0)+(nut.snack?1:0), items, nut};
}
function toggleNut(id){
  const t=todayISO(); if(!state.daily[t]) state.daily[t]={};
  const d=state.daily[t]; if(!d.nut) d.nut={};
  if(d.nut[id]) delete d.nut[id]; else d.nut[id]=true;
  saveState(state); if(curTab==='nutri') renderNutri(); else renderToday();
}
function setDayType(v){ const t=todayISO(); if(!state.daily[t]) state.daily[t]={};
  state.daily[t].dayType=v; saveState(state); renderNutri(); }
function setNutriCfg(k,v){ if(!state.nutriCfg) state.nutriCfg={};
  if(k==='scoop'||k==='creatine'){ const n=Number(v); if(!(n>0)) return; v=n; }
  else if(!/^\d{1,2}:\d{2}$/.test(v)) return;
  state.nutriCfg[k]=v; saveState(state); renderNutri(); }
function latestBw(){ const a=Object.entries(state.daily).filter(([d,v])=>v.bw!=null&&d<=todayISO()).sort((x,y)=>x[0]<y[0]?1:-1);
  return a.length?Number(a[0][1].bw):null; }
// 최근 7일 평균 vs 그 전 7일 평균 → 주간 체중 변화
function weightTrend(){
  const t=todayISO(), avg=(from,to)=>{ const v=[]; for(let i=from;i<=to;i++){ const d=state.daily[addDays(t,-i)]; if(d&&d.bw!=null) v.push(Number(d.bw)); }
    return v.length>=2?v.reduce((a,b)=>a+b,0)/v.length:null; };
  const now=avg(0,6), prev=avg(7,13);
  return (now!=null&&prev!=null)?now-prev:null;
}
function creatineStartedRecently(){
  const days=Object.keys(state.daily).filter(d=>(state.daily[d].nut||{}).cr).sort();
  return days.length>0 && days[0]>=addDays(todayISO(),-14);
}
// 체중 증가 속도 → 식사량·유산소 조언. 벌크 목표: 주 +0.25~0.5kg
function bulkAdvice(){
  const r=weightTrend();
  if(r==null) return {cardio:null,msg:'체중을 2주간(주당 2회 이상) 기록하면 증가 속도에 맞춰 식사량·유산소를 조언합니다. 목표: <b>주 +0.25~0.5kg</b>'};
  const rs=(r>0?'+':'')+r.toFixed(2)+'kg/주';
  const water=creatineStartedRecently()?'<br>※ 크레아틴 시작 후 1~2주는 수분으로 0.5~1kg 늘 수 있어요. 이 기간은 조절하지 말고 지켜보세요.':'';
  if(r<0.1) return {cardio:false,msg:`최근 체중 변화 <b>${rs}</b> → 정체. 하루 <b>+200kcal</b> (밥 반 공기 + 바나나 1개 정도) 늘리고 유산소는 쉬세요.${water}`};
  if(r<0.25) return {cardio:false,msg:`최근 체중 변화 <b>${rs}</b> → 조금 느림. 하루 <b>+100~150kcal</b> 늘리세요. 유산소는 선택.${water}`};
  if(r<=0.5) return {cardio:null,msg:`최근 체중 변화 <b>${rs}</b> → <b>적정 속도 ✓</b> 지금처럼 유지. 유산소는 원하면 주 1~2회 20분.${water}`};
  return {cardio:true,msg:`최근 체중 변화 <b>${rs}</b> → 빠름(체지방 증가 위험). 하루 <b>-150kcal</b> 줄이거나 <b>유산소 20분 주 2회</b>를 추가하세요.${water}`};
}
function nextItem(st){
  const now=new Date(), m=now.getHours()*60+now.getMinutes();
  return st.items.find(i=>!st.nut[i.id] && i.t!=null && i.t>=m-30) || st.items.find(i=>!st.nut[i.id]) || null;
}
function nutriSummaryCard(){
  const st=nutriStatus(todayISO()), nx=nextItem(st);
  return `<div class="card nsum" onclick="switchTab('nutri')">
    <div><h3 style="margin:0 0 4px">🥤 오늘 영양 · ${st.train?'운동일':'휴식일'}</h3>
      <div style="font-size:12.5px;color:var(--sub)">${nx?`다음: <b style="color:var(--txt)">${nx.t!=null?hm(nx.t)+' ':''}${nx.nm}</b>`:'오늘 체크 모두 완료 ✓'}
      ${st.creatine?'':' · <span style="color:var(--warn)">크레아틴 전</span>'}</div></div>
    <div class="big" style="color:${st.done===st.total?'var(--ok)':'var(--txt)'}">${st.done}<span class="u" style="font-size:12px;color:var(--mut)">/${st.total}</span></div>
  </div>`;
}
let nutriCfgOpen=false;
function renderNutri(){
  const t=todayISO(), st=nutriStatus(t), c=ncfg(), nx=nextItem(st), bw=latestBw(), adv=bulkAdvice();
  let html=`<div class="card"><div class="daytoggle">
      <button class="${st.train?'on':''}" onclick="setDayType('train')">🏋️ 운동일</button>
      <button class="${st.train?'':'on'}" onclick="setDayType('rest')">😴 휴식일</button></div>
    <div class="muted" style="margin-top:8px">${fmtDate(t)} (${dows(t)}) · 체크 ${st.done}/${st.total}${st.train?` · 운동 ${c.workout}`:''}</div></div>`;

  html+=`<div class="card"><h3>오늘 먹을 것 · 시간순</h3>`;
  html+=st.items.map(i=>`<div class="nitem ${i.sup?'sup':''} ${st.nut[i.id]?'done':''} ${nx&&nx.id===i.id?'next':''}">
      <div class="t">${i.t!=null?hm(i.t):'종일'}</div>
      <div><div class="nm">${i.nm}</div><div class="amt">${i.amt}</div></div>
      <button class="donebtn ${st.nut[i.id]?'on':''}" aria-label="${i.nm} 완료" onclick="toggleNut('${i.id}')"></button>
    </div>`).join('');
  html+=`</div>`;

  // 목표량
  html+=`<div class="card"><h3>하루 목표량 ${bw?`· 체중 ${bw}kg 기준`:''}</h3>`;
  if(bw){
    const pMin=Math.round(bw*1.6), pMax=Math.round(bw*2.2), pT=Math.round(bw*2), sc=c.scoop;
    const food=Math.max(0,pT-sc), kcal=Math.round((bw*32+300)/50)*50;
    html+=`<div class="advice">단백질 <b>${pT}g</b> (범위 ${pMin}~${pMax}g) — 보충제 1스쿱 ${sc}g 빼면 식사로 약 <b>${food}g</b>, 끼니당 <b>${Math.round(food/3)}g</b><br>
      열량 약 <b>${kcal.toLocaleString()}kcal</b> (유지 추정치 + 300) · 크레아틴 <b>${c.creatine}g</b> 매일</div>
      <div class="muted" style="text-align:left">열량은 추정치입니다. 아래 체중 추세를 보고 조절하세요.</div>`;
  } else html+=`<div class="muted" style="text-align:left">오늘 탭에서 체중을 기록하면 단백질·열량 목표가 계산됩니다.</div>`;
  html+=`</div>`;

  // 체중 추세 조언
  html+=`<div class="card"><h3>체중 추세 · 식사량/유산소 조언</h3><div class="advice">${adv.msg}</div></div>`;

  // 최근 7일
  let strip='';
  for(let i=6;i>=0;i--){ const d=addDays(t,-i), s=nutriStatus(d);
    strip+=`<div style="text-align:center;font-size:11px;color:var(--sub)"><div>${dows(d)}</div>
      <div style="font-size:15px;margin:3px 0">${s.creatine?'💊':'·'}</div>
      <div style="color:${s.done===s.total?'var(--ok)':'var(--mut)'}">${s.any?`${s.done}/${s.total}`:'-'}</div></div>`; }
  const crDays=[0,1,2,3,4,5,6].filter(i=>nutriStatus(addDays(t,-i)).creatine).length;
  html+=`<div class="card"><h3>최근 7일 · 크레아틴 ${crDays}/7일</h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${strip}</div>
    <div class="legend"><span>💊 크레아틴 먹은 날</span><span>숫자: 체크 완료/전체</span></div></div>`;

  // 설정
  html+=`<div class="card"><div class="collapse-h" onclick="nutriCfgOpen=!nutriCfgOpen;renderNutri()">
      <h3 style="margin:0">⚙️ 시간 · 보충제 양 설정</h3><span class="chev ${nutriCfgOpen?'open':''}">▸</span></div>
    ${nutriCfgOpen?`<div class="tinput" style="margin-top:10px">
      <div><label>운동 시작</label><input type="time" value="${c.workout}" onchange="setNutriCfg('workout',this.value)"></div>
      <div><label>아침</label><input type="time" value="${c.breakfast}" onchange="setNutriCfg('breakfast',this.value)"></div>
      <div><label>점심</label><input type="time" value="${c.lunch}" onchange="setNutriCfg('lunch',this.value)"></div>
      <div><label>저녁</label><input type="time" value="${c.dinner}" onchange="setNutriCfg('dinner',this.value)"></div>
      <div><label>보충제 1스쿱 단백질(g)</label><input type="number" inputmode="numeric" value="${c.scoop}" onchange="setNutriCfg('scoop',this.value)"></div>
      <div><label>크레아틴(g/일)</label><input type="number" inputmode="decimal" step="0.5" value="${c.creatine}" onchange="setNutriCfg('creatine',this.value)"></div>
    </div>
    <div class="muted" style="text-align:left;margin-top:10px">운동 시간이 식사와 겹치면 식사가 운동 후로 자동 이동하고, 마지막 식사가 운동 3시간 전보다 이르면 운동 전 간식이 추가됩니다.</div>`:''}
  </div>
  <div class="muted" style="text-align:left;padding:0 4px 12px">크레아틴은 로딩 없이 매일 ${c.creatine}g이면 3~4주 안에 충분히 쌓입니다. 신장 질환이 있거나 복용 중인 약이 있으면 시작 전에 의사와 상담하세요.</div>`;
  document.getElementById('view-nutri').innerHTML=html;
}

/* ===== 유산소 (선택) — 날짜별 분(daily.cardio)으로 기록 ===== */
function renderCardio(ex){
  const d=state.daily[todayISO()]||{}, on=d.cardio!=null, adv=bulkAdvice();
  const hint = adv.cardio===true?'<b style="color:var(--warn)">오늘 추가 권장</b> · 체중이 빠르게 늘고 있어요'
    : adv.cardio===false?'<b style="color:var(--ok)">오늘은 쉬어도 됩니다</b> · 체중 증가가 느려요':'원하면 추가 · 체중 추세 적정/미확인';
  const def=parseIntReps(ex.sets[0].reps)||20;
  return `<div class="ex cardio">
    <div class="exhead"><div><div class="exname">${ex.name}</div><div class="exmeta">${ex.note||''}</div></div></div>
    <div class="rec" style="cursor:default">${hint}</div>
    <div class="cardiorow">
      <div style="font-size:12px;color:var(--sub)">${on?`오늘 ${d.cardio}분 기록됨`:'했으면 분을 적고 체크'}</div>
      <div class="cell"><input id="cardioMin" type="number" inputmode="numeric" value="${on?d.cardio:def}"
        onchange="if(${on})saveDaily('cardio',this.value)"></div>
      <button class="donebtn ${on?'on':''}" aria-label="유산소 완료" onclick="toggleCardio()"></button>
    </div></div>`;
}
function toggleCardio(){
  const t=todayISO(); if(!state.daily[t]) state.daily[t]={};
  if(state.daily[t].cardio!=null){ delete state.daily[t].cardio; }
  else { const v=Number(document.getElementById('cardioMin').value)||20; state.daily[t].cardio=v; }
  saveState(state); renderToday();
}

      `<div><b>${esc(exLabel(n))}</b> ${arr.map(x=>x.min!=null?x.min+'분':`${x.load!=null?x.load+'kg×':''}${x.reps??'-'}${x.rpe?`@${x.rpe}`:''}`).join(', ')}</div>`).join('');
    if(log.free){ // 자유 운동: 시작–종료 · 운동 시간, 눌러서 수정

        <div class="top">
          <div><span class="pill" style="background:var(--accent);color:#160d2e">자유</span>

          <div class="d">${log.date?`${fmtDate(log.date)} (${dows(log.date)})`:''} ✏️</div>
        </div>
        <div class="sets-sm">${setsHtml||'<span style="color:var(--mut)">기록된 세트 없음</span>'}</div>
        ${vol?`<div class="d" style="margin-top:6px">${log.sets.length}세트 · 총 볼륨 <b style="color:var(--txt)">${Math.round(vol).toLocaleString()} kg</b></div>`:''}
      </div>`;
      return;
    }
    const s=sessById[id]||{id, weekTitle:'이전 프로그램', type:'pull'};
    html+=`<div class="hcard">
      <div class="top">
        <div><span class="pill" style="background:${s.type==='push'?'var(--push)':'var(--pull)'};color:#111">${s.id}</span>
